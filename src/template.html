<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoUI</title>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Lists and projects"></aside>

      <header class="app-header" id="app-header"></header>

      <main class="main">
        <section class="list-pane" id="list-pane" aria-label="Todos"></section>
        <section class="detail-pane" id="detail-pane" aria-label="Todo details"></section>
      </main>
    </div>
  </body>
</html>
